services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perfume-store-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - perfume-store-network

  mongodb:
    image: mongo:7
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodb-data:

networks:
  perfume-store-network:
    driver: bridge
